<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JARVIS V2.5</title>
<style>
body{margin:0;background:#071016;color:#e8f4f7;font:16px Arial,sans-serif;height:100vh}
.app{height:100vh;display:flex;flex-direction:column;max-width:900px;margin:auto}
.top{padding:14px;border-bottom:1px solid #203540;display:flex;justify-content:space-between}
.brand{font-weight:bold;color:#39d8ff;letter-spacing:2px}.status{color:#57e389;font-size:12px}
.chat{flex:1;overflow:auto;padding:12px}.msg{margin:8px 0}.bubble{display:inline-block;max-width:85%;padding:11px 13px;border:1px solid #203540;border-radius:12px;background:#0d1820;white-space:pre-wrap}
.user{text-align:right}.user .bubble{background:#10242e}
.composer{display:flex;gap:7px;padding:9px;border-top:1px solid #203540}
.input{flex:1;min-width:0;padding:13px;border:1px solid #29404b;border-radius:10px;background:#0a151c;color:white;font-size:16px}
button{padding:11px 15px;border:1px solid #2d5361;border-radius:10px;background:#10232b;color:white;font-weight:bold}
button:disabled{opacity:.5}.bottom{text-align:center;color:#78909a;font-size:11px;padding:6px}
</style>
</head>
<body>
<div class="app">
<header class="top"><b class="brand">J.A.R.V.I.S.</b><span id="status" class="status">Ready</span></header>
<main id="chat" class="chat"></main>
<div class="composer">
<input id="input" class="input" autocomplete="off" placeholder="Type a message...">
<button id="send" type="button">SEND</button>
</div>
<div class="bottom">Type a message, then tap SEND or press Enter.</div>
</div>

<script>
(function(){
"use strict";

var input=document.getElementById("input");
var send=document.getElementById("send");
var chat=document.getElementById("chat");
var status=document.getElementById("status");

function add(role,text){
  var row=document.createElement("div");
  row.className="msg "+role;
  var bubble=document.createElement("span");
  bubble.className="bubble";
  bubble.textContent=text;
  row.appendChild(bubble);
  chat.appendChild(row);
  chat.scrollTop=chat.scrollHeight;
  return bubble;
}

function reply(text){
  var s=text.toLowerCase().trim();
  if(s==="hi"||s==="hello"||s==="hey"||s.indexOf("hello ")===0)
    return "Hello. JARVIS is ready.";
  if(s==="time"||s.indexOf("what time")>=0)
    return "The current time is "+new Date().toLocaleTimeString()+".";
  if(s==="date"||s.indexOf("what date")>=0||s==="today")
    return "Today is "+new Date().toLocaleDateString()+".";
  if(s==="status")
    return "JARVIS V2.5 is online and the message system is working.";
  if(s==="help")
    return "Try: hello, time, date, status, or type any message.";
  return "I received: "+text+"\n\nJARVIS local mode is working. AI replies can be connected later.";
}

function sendMessage(){
  var text=input.value.trim();
  if(!text)return;
  add("user",text);
  input.value="";
  input.focus();
  status.textContent="Working...";
  send.disabled=true;

  setTimeout(function(){
    add("assistant",reply(text));
    status.textContent="Ready";
    send.disabled=false;
    input.focus();
  },100);
}

send.addEventListener("click",sendMessage);
input.addEventListener("keydown",function(e){
  if(e.key==="Enter"){
    e.preventDefault();
    sendMessage();
  }
});

add("assistant","JARVIS is ready. Type a message.");
input.focus();
})();
</script>
</body>
</html>
