name: Build JARVIS APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare web files
        run: |
          mkdir -p www
          cp jarvis-app.html www/index.html
      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor-community/speech-recognition@6
      - name: Capacitor config
        run: |
          cat > capacitor.config.json <<'EOF2'
          {"appId":"com.jarvis.app","appName":"JARVIS","webDir":"www","backgroundColor":"#071016","plugins":{"CapacitorHttp":{"enabled":true}}}
          EOF2
      - name: Add Android and sync
        run: |
          npx cap add android
          npx cap sync android
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: JARVIS build ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
